<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LELE Kursi Galatama</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #090e1a; color: #f8fafc; padding: 6px 8px; font-size: 11px; }
  .wrap { width: 100%; max-width: 1280px; margin: 0 auto; }

  /* POP-UP TOAST RINGAN (TIDAK BLOKIR KLIK) */
  .toast-wrap {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 250; pointer-events: none; display: flex; flex-direction: column; gap: 6px; align-items: center;
  }
  .toast-box {
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border: 2px solid #fbbf24; border-radius: 10px;
    padding: 8px 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.65);
    display: flex; align-items: center; gap: 10px;
    opacity: 0; transform: translateY(-10px) scale(0.96);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .toast-box.show { opacity: 1; transform: translateY(0) scale(1); }
  .toast-box.t-start { border-color: #10b981; }
  .toast-box.t-warn { border-color: #ef4444; background: linear-gradient(135deg, #450a0a, #190505); }
  .toast-box.t-bin { border-color: #a855f7; background: linear-gradient(135deg, #2e1065, #140929); }
  .toast-tag {
    font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 4px;
    background: #fbbf24; color: #000; letter-spacing: 0.4px;
  }
  .toast-box.t-start .toast-tag { background: #10b981; color: #000; }
  .toast-box.t-warn .toast-tag { background: #ef4444; color: #fff; }
  .toast-box.t-bin .toast-tag { background: #a855f7; color: #fff; }
  .toast-msg { font-size: 14px; font-weight: 900; color: #f8fafc; white-space: nowrap; }

  .top-bar {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
    background: linear-gradient(135deg, #1b2842, #111a2c);
    border: 1.5px solid #354b70; border-radius: 9px; padding: 10px 14px; margin-bottom: 6px;
  }
  .top-left { display: flex; flex-direction: column; gap: 6px; }
  .brand-title { font-size: 20px; font-weight: 900; color: #fbbf24; letter-spacing: 0.5px; line-height: 1.1; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pill { background: #0b1220; border: 1px solid #425982; padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 13px; }
  .pill-bin { border-color: #a855f7; color: #f3e8ff; background: #2a1842; }

  .right-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .mini-stat { background: #0b1220; border: 1px solid #3b4f73; border-radius: 7px; padding: 5px 11px; text-align: center; min-width: 72px; }
  .mini-stat small { color: #94a3b8; font-size: 10px; font-weight: 800; display: block; line-height: 1.1; }
  .mini-stat strong { font-size: 18px; font-weight: 900; color: #10b981; line-height: 1.2; }

  .timer-box {
    display: flex; align-items: center; gap: 7px;
    background: #090e1a; border: 2px solid #fbbf24; border-radius: 8px; padding: 6px 10px;
  }
  .timer-txt {
    font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums;
    min-width: 68px; text-align: center; color: #fff; line-height: 1;
  }
  .warn { color: #ef4444; }

  .cfg-bar {
    display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
    background: #151f32; border: 1px solid #2c3e5c; border-radius: 7px; padding: 5px 9px; margin-bottom: 6px;
  }
  .cfg-bar label { color: #94a3b8; font-size: 11px; font-weight: 600; }

  input, button { background: #0b1220; color: #f8fafc; border: 1px solid #475569; border-radius: 4px; padding: 3px 6px; font-size: 11px; }
  button { cursor: pointer; font-weight: 800; border: none; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  .b-gold { background: #fbbf24; color: #000; }
  .b-green { background: #10b981; color: #000; }
  .b-red { background: #ef4444; color: #fff; }
  .b-purple { background: #a855f7; color: #fff; }
  .b-gray { background: #334155; color: #fff; }
  .b-blue { background: #38bdf8; color: #000; }

  .list-panel { background: #151f32; border: 1px solid #2c3e5c; border-radius: 7px; overflow: hidden; }
  .list-head {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px;
    padding: 5px 9px; background: #1a263d; border-bottom: 1px solid #2c3e5c;
  }
  .list-head h2 { font-size: 12px; font-weight: 900; color: #fbbf24; }
  .sum-pills { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 10px; font-weight: 700; }
  .sum-pills span { background: #0b1220; padding: 2px 6px; border-radius: 4px; border: 1px solid #334155; }

  .two-col-grid { display: grid; grid-template-columns: 1fr 1fr; }
  .col-box:first-child { border-right: 1px solid #2c3e5c; }

  @media (max-width: 980px) {
    .two-col-grid { grid-template-columns: 1fr; }
    .col-box:first-child { border-right: none; }
  }

  .seat-row {
    display: grid;
    grid-template-columns: 22px minmax(74px, 96px) minmax(74px, 96px) minmax(80px, 1fr) 40px 28px 42px auto;
    align-items: center;
    gap: 3px;
    padding: 3px 5px;
    background: #121b2d;
    border-bottom: 1px solid #1e2d44;
  }
  .seat-row:nth-child(even) { background: #172238; }
  .seat-row.has-bid { border-left: 3px solid #fbbf24; }
  .seat-row.locked { border-left: 3px solid #10b981; }
  .seat-row.bin-row { border-left: 3px solid #a855f7; background: #211633; }

  .r-no { font-weight: 900; font-size: 11px; color: #fbbf24; }

  .copy-box {
    display: flex; align-items: center; justify-content: space-between; gap: 2px;
    background: #0b1220; border: 1px solid #334155; border-radius: 4px;
    padding: 1px 3px; min-width: 0;
  }
  .tt-txt {
    font-size: 10px; font-weight: 700; color: #fbbf24;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    user-select: all; cursor: text; flex: 1;
  }
  .disp-txt {
    font-size: 10px; font-weight: 700; color: #7dd3fc;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    user-select: all; cursor: text; flex: 1;
  }
  .box-empty { color: #475569; font-style: italic; font-weight: 400; user-select: none; }
  .copy-mini {
    background: #1e293b; color: #e2e8f0; border: 1px solid #475569;
    border-radius: 3px; padding: 1px 3px; font-size: 8px; font-weight: 800; flex-shrink: 0;
  }
  .copy-mini:hover { background: #38bdf8; color: #000; border-color: #38bdf8; }

  .player-cell { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .ava-box {
    width: 21px; height: 21px; border-radius: 50%;
    border: 1.5px solid #475569; background: #0b1220;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 9px; font-weight: 900; color: #fbbf24;
  }
  .seat-row.has-bid .ava-box { border-color: #fbbf24; }
  .seat-row.locked .ava-box { border-color: #10b981; }
  .seat-row.bin-row .ava-box { border-color: #a855f7; }
  .ava-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .r-name { font-weight: 800; font-size: 10px; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }
  .r-empty { color: #64748b; font-style: italic; font-weight: 400; font-size: 10px; }

  .r-badge { display: inline-block; text-align: center; font-size: 9px; font-weight: 900; padding: 1px 3px; border-radius: 3px; background: #334155; color: #cbd5e1; }
  .badge-bid { background: #453208; color: #fbbf24; }
  .badge-lock { background: #093b2a; color: #34d399; }
  .badge-bin { background: #3b195c; color: #f3e8ff; }

  .r-val { font-weight: 900; font-size: 11px; color: #10b981; text-align: right; }

  .pay-btn { padding: 1px 3px; border-radius: 3px; font-size: 9px; width: 100%; }
  .paid { background: #093b2a; color: #34d399; border: 1px solid #10b981; }
  .unpaid { background: #451212; color: #f87171; border: 1px solid #ef4444; }

  .r-actions { display: flex; gap: 2px; justify-content: flex-end; }
  .r-actions button { padding: 2px 3px; font-size: 9px; line-height: 1.1; }

  .modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.78);
    justify-content: center; align-items: center; z-index: 100;
  }
  .modal.active { display: flex; }
  .modal-content { background: #151f32; padding: 14px; border-radius: 9px; width: 335px; border: 2px solid #fbbf24; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
  .modal-head h3 { color: #fbbf24; font-size: 14px; }
  .ava-preview {
    width: 48px; height: 48px; border-radius: 50%;
    border: 2px solid #fbbf24; background: #0b1220;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 900; color: #fbbf24; flex-shrink: 0;
  }
  .ava-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ava-status { font-size: 10px; color: #94a3b8; margin-top: 3px; min-height: 13px; }

  .form-group { margin-bottom: 8px; }
  .form-group label { display: block; font-size: 10px; margin-bottom: 2px; color: #94a3b8; }
  .form-group input[type="text"], .form-group input[type="number"] { width: 100%; padding: 5px 7px; font-size: 12px; }
  .input-copy-row { display: flex; gap: 4px; align-items: center; }
  .input-copy-row input { flex: 1; }
  .ava-tools { display: flex; gap: 4px; margin-top: 4px; align-items: center; }
  .ava-tools input[type="file"] { font-size: 10px; max-width: 185px; }
  .quick-bids { display: flex; gap: 3px; margin-top: 4px; }
  .quick-bids button { flex: 1; font-size: 10px; padding: 4px; }

  #infoBar { margin-left: 4px; font-size: 10px; font-weight: 800; color: #34d399; }
</style>
</head>
<body>

<div class="toast-wrap" id="toastWrap"></div>

<div class="wrap">

  <div class="top-bar">
    <div class="top-left">
      <div class="brand-title">LELE KURSI</div>
      <div class="pills">
        <span class="pill">OB: <span id="dOb" style="color:#fbbf24">r14</span></span>
        <span class="pill">INC: <span id="dInc" style="color:#10b981">r1</span></span>
        <span class="pill pill-bin">B.I.N: <span id="dBin">r16</span> • <span id="dBinNote">+10 MENIT DIAWAL</span></span>
      </div>
    </div>

    <div class="right-stats">
      <div class="mini-stat">
        <small>KURSI</small>
        <strong id="dSlot">0/19</strong>
      </div>
      <div class="mini-stat">
        <small>TOTAL</small>
        <strong id="dTotal">r0</strong>
      </div>
      <div class="timer-box">
        <div class="timer-txt" id="timer">00:00</div>
        <input type="number" id="timerInput" value="30" min="1" max="999" style="width:46px; padding:4px; font-size:12px; text-align:center;">
        <button type="button" class="b-gold" style="padding:5px 9px;font-size:12px" onclick="setTimerFromInput()">Set</button>
        <button type="button" class="b-gray" style="padding:5px 7px;font-size:12px" onclick="togglePause()" id="pauseBtn">||</button>
        <button type="button" class="b-red" style="padding:5px 7px;font-size:12px" onclick="stopTimer()">0</button>
      </div>
    </div>
  </div>

  <div class="cfg-bar">
    <label>Kursi:</label><input type="number" id="inCount" value="19" min="1" max="30" style="width:38px">
    <label>OB:</label><input type="number" id="inOb" value="14" step="1" style="width:42px">
    <label>INC:</label><input type="number" id="inInc" value="1" step="1" style="width:38px">
    <label>B.I.N:</label><input type="number" id="inBin" value="16" step="1" style="width:42px">
    <label>Ket. B.I.N:</label><input type="text" id="inBinNote" value="+10 MENIT DIAWAL" style="width:140px">
    <button type="button" class="b-gold" style="padding:3px 8px" onclick="saveCfg()">Simpan</button>
    <button type="button" class="b-blue" style="padding:3px 8px" onclick="toggleSound()" id="soundBtn">Suara: ON</button>
    <span id="infoBar"></span>
    <button type="button" class="b-red" style="padding:3px 8px; margin-left:auto;" onclick="resetAll()">Reset</button>
  </div>

  <div class="list-panel">
    <div class="list-head">
      <h2>LIST KURSI & CEK</h2>
      <div class="sum-pills">
        <span>OKE: <strong id="wPaidCnt" style="color:#10b981">0/0</strong></span>
        <span>CEK: <strong id="wPaidSum" style="color:#10b981">r0</strong></span>
        <span>PENDING: <strong id="wUnpaidSum" style="color:#ef4444">r0</strong></span>
        <button type="button" class="b-gold" style="padding:2px 7px" onclick="copyAllTikTok()">Salin TikTok</button>
        <button type="button" class="b-blue" style="padding:2px 7px" onclick="copyAllDisplays()">Salin Display</button>
        <button type="button" class="b-gold" style="padding:2px 7px" onclick="copyList()">Salin List</button>
      </div>
    </div>
    <div class="two-col-grid">
      <div class="col-box" id="colLeft"></div>
      <div class="col-box" id="colRight"></div>
    </div>
  </div>

</div>

<div class="modal" id="bidModal">
  <div class="modal-content">
    <div class="modal-head">
      <div>
        <h3 id="modalTitle">Kursi #1</h3>
        <div class="ava-status" id="avaStatus">Isi Nama TikTok & Username Roblox</div>
      </div>
      <div class="ava-preview" id="avaPreview">?</div>
    </div>

    <div class="form-group">
      <label>1. Nama TikTok (Bisa Di-Copy)</label>
      <div class="input-copy-row">
        <input type="text" id="tiktokInput" placeholder="Contoh: Creymoon...">
        <button type="button" class="b-gold" style="padding:5px 8px;font-size:10px;" onclick="copyModalTikTok()">Copy</button>
      </div>
    </div>
    <div class="form-group">
      <label>2. Display Name (Otomatis / Bisa Diedit & Di-Copy)</label>
      <div class="input-copy-row">
        <input type="text" id="displayInput" placeholder="Display name muncul di sini...">
        <button type="button" class="b-blue" style="padding:5px 8px;font-size:10px;" onclick="copyModalDisplay()">Copy</button>
      </div>
    </div>
    <div class="form-group">
      <label>3. Username Roblox (Otomatis Cek Display & Ava)</label>
      <input type="text" id="bidderInput" placeholder="Ketik username Roblox...">
    </div>
    <div class="form-group">
      <label>Avatar Cadangan (Upload Foto / URL Gambar Opsional)</label>
      <input type="text" id="avaUrlInput" placeholder="URL gambar atau path file (opsional)...">
      <div class="ava-tools">
        <input type="file" id="avaFileInput" accept="image/*">
        <button type="button" class="b-gray" style="padding:3px 6px;font-size:10px;" onclick="clearCustomAva()">Hapus Ava</button>
      </div>
    </div>
    <div class="form-group">
      <label>Angka (misal 14 untuk r14)</label>
      <input type="number" id="amountInput" step="1">
      <div class="quick-bids">
        <button type="button" class="b-gray" onclick="addBid(1)">+1x</button>
        <button type="button" class="b-gray" onclick="addBid(2)">+2x</button>
        <button type="button" class="b-purple" onclick="setBinVal()">B.I.N</button>
      </div>
    </div>
    <div style="display:flex; gap:5px; margin-top:10px;">
      <button type="button" class="b-green" style="flex:1; padding:6px;" onclick="saveBid()">Simpan</button>
      <button type="button" class="b-gray" style="padding:6px;" onclick="closeModal()">Batal</button>
    </div>
  </div>
</div>

<script>
  var cfg = { count: 19, ob: 14, inc: 1, bin: 16, binNote: '+10 MENIT DIAWAL' };
  var seats = [];
  var activeSeatIndex = null;
  var forceBinMode = false;
  var timerInterval = null;
  var timeLeft = 0;
  var isPaused = false;
  var warned10Sec = false;
  var soundEnabled = true;
  var audioCtx = null;
  var toastTimer = null;

  var robloxCache = {};
  var currentModalAvatar = '';
  var manualAvatarOverride = false;
  var manualDisplayOverride = false;
  var lookupTimer = null;

  function rFmt(n) { return 'r' + Number(n || 0); }

  function esc(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function initialChar(name) {
    var t = String(name || '').trim();
    return t ? t.charAt(0).toUpperCase() : '?';
  }

  function setInfo(msg) {
    var b = document.getElementById('infoBar');
    if (b) { b.innerText = msg; }
  }

  /* NADA & SUARA BICARA (WEB AUDIO + SPEECH SYNTHESIS) */
  function getAudioCtx() {
    if (!soundEnabled) return null;
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function() {});
    }
    return audioCtx;
  }

  function playTone(freq, startOffset, duration, type, gainPeak) {
    var ctx = getAudioCtx();
    if (!ctx) return;
    var now = ctx.currentTime + (startOffset || 0);
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(gainPeak || 0.16, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, now + (duration || 0.18));
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + (duration || 0.18) + 0.02);
  }

  function speakText(text) {
    if (!soundEnabled || !text) return;
    if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') return;
    try {
      window.speechSynthesis.cancel();
      var utter = new SpeechSynthesisUtterance(String(text));
      utter.lang = 'id-ID';
      utter.rate = 1.05;
      utter.pitch = 1.0;
      utter.volume = 1.0;
      window.speechSynthesis.speak(utter);
    } catch (e) {}
  }

  function soundStartAuction() {
    playTone(523.25, 0.00, 0.14, 'triangle', 0.18);
    playTone(659.25, 0.11, 0.14, 'triangle', 0.18);
    playTone(783.99, 0.22, 0.24, 'triangle', 0.20);
    setTimeout(function() { speakText('Lele dimulai'); }, 220);
  }

  function soundWarn10Sec() {
    playTone(880.00, 0.00, 0.11, 'square', 0.10);
    playTone(880.00, 0.15, 0.11, 'square', 0.10);
    setTimeout(function() { speakText('Waktu sisa 10 detik'); }, 180);
  }

  function soundFinishAuction() {
    playTone(783.99, 0.00, 0.14, 'triangle', 0.18);
    playTone(659.25, 0.13, 0.14, 'triangle', 0.18);
    playTone(523.25, 0.26, 0.28, 'triangle', 0.20);
    setTimeout(function() { speakText('Waktu selesai'); }, 260);
  }

  function soundSeatSaved(isBin, spokenLabel, seatId) {
    if (isBin) {
      playTone(659.25, 0.00, 0.12, 'sine', 0.18);
      playTone(880.00, 0.10, 0.14, 'sine', 0.18);
      playTone(1046.50, 0.20, 0.24, 'sine', 0.20);
    } else {
      playTone(587.33, 0.00, 0.12, 'sine', 0.16);
      playTone(880.00, 0.10, 0.18, 'sine', 0.18);
    }
    if (spokenLabel && seatId) {
      setTimeout(function() {
        speakText(spokenLabel + ' berada di kursi ' + seatId);
      }, 180);
    }
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById('soundBtn').innerText = soundEnabled ? 'Suara: ON' : 'Suara: OFF';
    if (!soundEnabled && 'speechSynthesis' in window) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
    if (soundEnabled) {
      playTone(659.25, 0, 0.12, 'sine', 0.14);
      setInfo('Suara & bicara aktif');
    } else {
      setInfo('Suara dimatikan');
    }
  }

  /* POP-UP BANNER OTOMATIS HILANG */
  function showPopup(tag, message, themeClass) {
    var wrap = document.getElementById('toastWrap');
    if (!wrap) return;
    clearTimeout(toastTimer);
    wrap.innerHTML = '<div class="toast-box ' + (themeClass || '') + '" id="activeToast">' +
      '<span class="toast-tag">' + esc(tag) + '</span>' +
      '<span class="toast-msg">' + esc(message) + '</span>' +
    '</div>';
    requestAnimationFrame(function() {
      var el = document.getElementById('activeToast');
      if (el) el.className = 'toast-box ' + (themeClass || '') + ' show';
    });
    toastTimer = setTimeout(function() {
      var el = document.getElementById('activeToast');
      if (el) el.className = 'toast-box ' + (themeClass || '');
      setTimeout(function() {
        if (wrap) wrap.innerHTML = '';
      }, 220);
    }, 2300);
  }

  function copyTextSafe(txt, doneMsg) {
    if (!txt) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).catch(function() {});
    }
    setInfo(doneMsg || 'Tersalin!');
  }

  function makeSeat(idx, prev) {
    return {
      id: idx + 1,
      tiktok: (prev && prev.tiktok) ? prev.tiktok : '',
      name: (prev && prev.name) ? prev.name : '',
      displayName: (prev && prev.displayName) ? prev.displayName : '',
      avatarUrl: (prev && prev.avatarUrl) ? prev.avatarUrl : '',
      val: (prev && prev.val) ? Number(prev.val) : 0,
      locked: Boolean(prev && prev.locked),
      isBin: Boolean(prev && prev.isBin),
      paid: Boolean(prev && prev.paid)
    };
  }

  function initSeats() {
    var old = seats.slice();
    seats = [];
    var k = 0;
    while (k < cfg.count) {
      seats.push(makeSeat(k, old[k]));
      k++;
    }

    document.getElementById('inCount').value = cfg.count;
    document.getElementById('inOb').value = cfg.ob;
    document.getElementById('inInc').value = cfg.inc;
    document.getElementById('inBin').value = cfg.bin;
    document.getElementById('inBinNote').value = cfg.binNote;

    document.getElementById('dOb').innerText = rFmt(cfg.ob);
    document.getElementById('dInc').innerText = rFmt(cfg.inc);
    document.getElementById('dBin').innerText = rFmt(cfg.bin);
    document.getElementById('dBinNote').innerText = cfg.binNote || '-';
    render();
  }

  function renderAvatarBox(url, fallbackText) {
    if (url) {
      return '<div class="ava-box"><img src="' + esc(url) + '" alt="ava" onerror="this.style.display=\'none\';this.parentNode.innerText=\'' + esc(fallbackText) + '\';"></div>';
    }
    return '<div class="ava-box">' + esc(fallbackText) + '</div>';
  }

  function renderTikTokCell(seat, idx) {
    var tName = (seat.tiktok || '').trim();
    if (!tName) {
      return '<div class="copy-box"><span class="tt-txt box-empty">-</span></div>';
    }
    return '<div class="copy-box" title="TikTok: ' + esc(tName) + '">' +
      '<span class="tt-txt">' + esc(tName) + '</span>' +
      '<button type="button" class="copy-mini" onclick="copySeatTikTok(' + idx + ')">Copy</button>' +
    '</div>';
  }

  function renderDisplayCell(seat, idx) {
    var dName = (seat.displayName || '').trim();
    if (!dName) {
      return '<div class="copy-box"><span class="disp-txt box-empty">-</span></div>';
    }
    return '<div class="copy-box" title="Display: ' + esc(dName) + '">' +
      '<span class="disp-txt">' + esc(dName) + '</span>' +
      '<button type="button" class="copy-mini" onclick="copySeatDisplay(' + idx + ')">Copy</button>' +
    '</div>';
  }

  function copySeatTikTok(idx) {
    var st = seats[idx];
    if (!st || !st.tiktok) return;
    copyTextSafe(st.tiktok.trim(), 'TikTok #' + st.id + ' tersalin!');
  }

  function copySeatDisplay(idx) {
    var st = seats[idx];
    if (!st || !st.displayName) return;
    copyTextSafe(st.displayName.trim(), 'Display #' + st.id + ' tersalin!');
  }

  function copyModalTikTok() {
    var val = document.getElementById('tiktokInput').value.trim();
    if (!val) return;
    copyTextSafe(val, 'TikTok tersalin!');
  }

  function copyModalDisplay() {
    var val = document.getElementById('displayInput').value.trim();
    if (!val) return;
    copyTextSafe(val, 'Display tersalin!');
  }

  function render() {
    var leftHtml = '';
    var rightHtml = '';
    var split = Math.ceil(seats.length / 2);
    var filled = 0, total = 0, paidCount = 0, paidAmount = 0, unpaidAmount = 0;

    var idx = 0;
    while (idx < seats.length) {
      var st = seats[idx];
      var labelSource = st.name || st.tiktok || st.displayName;
      if (labelSource) {
        filled++;
        total += Number(st.val || 0);
        if (st.paid) { paidCount++; paidAmount += Number(st.val || 0); }
        else { unpaidAmount += Number(st.val || 0); }
      }

      var badge = 'OPEN', bCls = '', rowCls = 'seat-row';
      if (st.isBin) { badge = 'B.I.N'; bCls = 'badge-bin'; rowCls += ' locked bin-row'; }
      else if (st.locked) { badge = 'LOCK'; bCls = 'badge-lock'; rowCls += ' locked'; }
      else if (labelSource) { badge = 'TAKE'; bCls = 'badge-bid'; rowCls += ' has-bid'; }

      var payHtml = labelSource
        ? '<button type="button" class="pay-btn ' + (st.paid ? 'paid' : 'unpaid') + '" onclick="togglePaid(' + idx + ')">' + (st.paid ? 'OKE' : 'WAIT') + '</button>'
        : '<span style="color:#64748b;font-size:9px;">-</span>';

      var cached = st.name ? robloxCache[st.name.toLowerCase()] : null;
      var avaUrl = st.avatarUrl || (cached && cached.avatarUrl) || '';
      var avaHtml = labelSource
        ? renderAvatarBox(avaUrl, initialChar(st.name || st.displayName || st.tiktok))
        : '<div class="ava-box" style="color:#64748b;">•</div>';

      var usnHtml = st.name
        ? '<div class="r-name" title="Roblox: ' + esc(st.name) + '">' + esc(st.name) + '</div>'
        : '<div class="r-name r-empty">' + ((st.tiktok || st.displayName) ? '-' : 'Kosong') + '</div>';

      var oneRow = '<div class="' + rowCls + '">' +
        '<div class="r-no">#' + st.id + '</div>' +
        renderTikTokCell(st, idx) +
        renderDisplayCell(st, idx) +
        '<div class="player-cell">' + avaHtml + usnHtml + '</div>' +
        '<div><span class="r-badge ' + bCls + '">' + badge + '</span></div>' +
        '<div class="r-val">' + (st.val > 0 ? rFmt(st.val) : rFmt(cfg.ob)) + '</div>' +
        '<div>' + payHtml + '</div>' +
        '<div class="r-actions">' +
          '<button type="button" class="b-gold" onclick="openModal(' + idx + ', false)" ' + (st.locked ? 'disabled' : '') + '>TAKE</button>' +
          '<button type="button" class="b-gray" onclick="quickBump(' + idx + ')" ' + ((!labelSource || st.locked) ? 'disabled' : '') + '>+' + cfg.inc + '</button>' +
          '<button type="button" class="b-purple" onclick="openModal(' + idx + ', true)" ' + (st.locked ? 'disabled' : '') + '>B.I.N</button>' +
          '<button type="button" class="' + (st.locked ? 'b-red' : 'b-green') + '" onclick="toggleLock(' + idx + ')">' + (st.locked ? 'Buka' : 'Lock') + '</button>' +
        '</div>' +
      '</div>';

      if (idx < split) leftHtml += oneRow;
      else rightHtml += oneRow;
      idx++;
    }

    document.getElementById('colLeft').innerHTML = leftHtml;
    document.getElementById('colRight').innerHTML = rightHtml;

    document.getElementById('dSlot').innerText = filled + '/' + cfg.count;
    document.getElementById('dTotal').innerText = rFmt(total);
    document.getElementById('wPaidCnt').innerText = paidCount + '/' + filled;
    document.getElementById('wPaidSum').innerText = rFmt(paidAmount);
    document.getElementById('wUnpaidSum').innerText = rFmt(unpaidAmount);
  }

  function updateModalPreview(url, name) {
    currentModalAvatar = url || '';
    var box = document.getElementById('avaPreview');
    if (url) {
      box.innerHTML = '<img src="' + esc(url) + '" alt="preview" onerror="this.style.display=\'none\';this.parentNode.innerText=\'' + esc(initialChar(name)) + '\';">';
    } else {
      box.innerHTML = esc(initialChar(name));
    }
  }

  function applyFoundRobloxProfile(key, uname, info) {
    var prev = robloxCache[key] || {};
    var merged = {
      displayName: info.displayName || prev.displayName || '',
      avatarUrl: info.avatarUrl || prev.avatarUrl || ''
    };
    robloxCache[key] = merged;

    if (document.getElementById('bidderInput').value.trim().toLowerCase() !== key) return;

    if (!manualDisplayOverride && merged.displayName) {
      document.getElementById('displayInput').value = merged.displayName;
    }
    if (!manualAvatarOverride && merged.avatarUrl) {
      updateModalPreview(merged.avatarUrl, uname);
    }

    var statusParts = [];
    if (merged.displayName) statusParts.push('Display: ' + merged.displayName);
    if (merged.avatarUrl) statusParts.push('Ava OK');
    document.getElementById('avaStatus').innerText = statusParts.length ? statusParts.join(' • ') : 'Profil ditemukan';
  }

  function lookupRobloxUser(rawName) {
    var uname = String(rawName || '').trim();
    var stEl = document.getElementById('avaStatus');
    var fallbackInit = uname || document.getElementById('tiktokInput').value.trim();

    if (!uname) {
      if (!manualAvatarOverride) updateModalPreview('', fallbackInit);
      stEl.innerText = 'Isi Nama TikTok & Username Roblox';
      return;
    }

    var key = uname.toLowerCase();
    if (robloxCache[key] && (robloxCache[key].displayName || robloxCache[key].avatarUrl)) {
      applyFoundRobloxProfile(key, uname, robloxCache[key]);
      return;
    }

    if (!manualAvatarOverride) updateModalPreview('', fallbackInit);
    stEl.innerText = 'Mencari Display & Ava...';

    if (!window.fetch || window.location.protocol === 'file:') {
      stEl.innerText = 'Buka lewat link Netlify (isi manual / foto)';
      return;
    }

    fetch('/.netlify/functions/roblox-lookup?u=' + encodeURIComponent(uname))
      .then(function(res) { return res.ok ? res.json() : null; })
      .then(function(data) {
        if (data && data.ok) {
          applyFoundRobloxProfile(key, uname, {
            displayName: data.displayName || '',
            avatarUrl: data.avatarUrl || ''
          });
        } else if (document.getElementById('bidderInput').value.trim().toLowerCase() === key) {
          stEl.innerText = 'Username tidak ketemu (isi manual / foto)';
        }
      })
      .catch(function() {
        if (document.getElementById('bidderInput').value.trim().toLowerCase() === key) {
          stEl.innerText = 'Function Netlify belum aktif (isi manual / foto)';
        }
      });
  }

  document.getElementById('tiktokInput').addEventListener('input', function() {
    var rblxVal = document.getElementById('bidderInput').value.trim();
    if (!manualAvatarOverride && !currentModalAvatar && !rblxVal) {
      updateModalPreview('', this.value);
    }
  });

  document.getElementById('bidderInput').addEventListener('input', function() {
    var val = this.value;
    manualDisplayOverride = false;
    if (!manualAvatarOverride) {
      currentModalAvatar = '';
      updateModalPreview('', val || document.getElementById('tiktokInput').value);
    }
    clearTimeout(lookupTimer);
    lookupTimer = setTimeout(function() {
      lookupRobloxUser(val);
    }, 350);
  });

  document.getElementById('displayInput').addEventListener('input', function() {
    manualDisplayOverride = true;
  });

  function clearCustomAva() {
    manualAvatarOverride = false;
    currentModalAvatar = '';
    document.getElementById('avaFileInput').value = '';
    document.getElementById('avaUrlInput').value = '';
    var uname = document.getElementById('bidderInput').value.trim();
    var initSrc = uname || document.getElementById('tiktokInput').value.trim();
    var cached = uname ? robloxCache[uname.toLowerCase()] : null;
    if (cached && cached.avatarUrl) {
      updateModalPreview(cached.avatarUrl, initSrc);
      document.getElementById('avaStatus').innerText = 'Kembali ke Ava Roblox';
    } else {
      updateModalPreview('', initSrc);
      document.getElementById('avaStatus').innerText = 'Pakai inisial';
    }
  }

  document.getElementById('avaFileInput').addEventListener('change', function() {
    var file = this.files && this.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      manualAvatarOverride = true;
      document.getElementById('avaUrlInput').value = '';
      var initSrc = document.getElementById('bidderInput').value.trim() || document.getElementById('tiktokInput').value.trim();
      updateModalPreview(ev.target.result, initSrc);
      document.getElementById('avaStatus').innerText = 'Foto lokal dipilih';
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('avaUrlInput').addEventListener('input', function() {
    var url = this.value.trim();
    var initSrc = document.getElementById('bidderInput').value.trim() || document.getElementById('tiktokInput').value.trim();
    if (url) {
      manualAvatarOverride = true;
      updateModalPreview(url, initSrc);
      document.getElementById('avaStatus').innerText = 'URL/path gambar aktif';
    } else if (!manualAvatarOverride) {
      var uname = document.getElementById('bidderInput').value.trim();
      var cached = uname ? robloxCache[uname.toLowerCase()] : null;
      updateModalPreview((cached && cached.avatarUrl) || '', initSrc);
    }
  });

  function openModal(index, isBinAction) {
    activeSeatIndex = index;
    forceBinMode = Boolean(isBinAction);
    manualAvatarOverride = false;
    manualDisplayOverride = false;
    document.getElementById('avaFileInput').value = '';

    var seat = seats[index];
    document.getElementById('modalTitle').innerText = isBinAction
      ? 'B.I.N Kursi #' + seat.id + ' (' + rFmt(cfg.bin) + ')'
      : 'TAKE Kursi #' + seat.id;
    document.getElementById('tiktokInput').value = seat.tiktok || '';
    document.getElementById('displayInput').value = seat.displayName || '';
    document.getElementById('bidderInput').value = seat.name || '';
    document.getElementById('amountInput').value = isBinAction
      ? Number(cfg.bin)
      : (seat.val > 0 ? Number(seat.val) + Number(cfg.inc) : Number(cfg.ob));

    var savedAva = seat.avatarUrl || '';
    var isData = savedAva.indexOf('data:image') === 0;
    document.getElementById('avaUrlInput').value = isData ? '' : savedAva;
    if (isData || savedAva) manualAvatarOverride = true;
    if (seat.displayName) manualDisplayOverride = true;

    updateModalPreview(savedAva, seat.name || seat.displayName || seat.tiktok || '');
    document.getElementById('avaStatus').innerText = seat.name
      ? 'Mengecek Display & Ava...'
      : 'Isi Nama TikTok & Username Roblox';

    document.getElementById('bidModal').className = 'modal active';
    document.getElementById('tiktokInput').focus();
    if (seat.name) lookupRobloxUser(seat.name);
  }

  function closeModal() {
    clearTimeout(lookupTimer);
    document.getElementById('bidModal').className = 'modal';
    activeSeatIndex = null;
    forceBinMode = false;
    currentModalAvatar = '';
    manualAvatarOverride = false;
    manualDisplayOverride = false;
  }

  function addBid(multiplier) {
    var input = document.getElementById('amountInput');
    input.value = Number(input.value || 0) + (Number(cfg.inc) * multiplier);
  }

  function setBinVal() {
    forceBinMode = true;
    document.getElementById('amountInput').value = Number(cfg.bin);
  }

  function saveBid() {
    if (activeSeatIndex === null) return;
    var idx = activeSeatIndex;
    var tt = document.getElementById('tiktokInput').value.trim();
    var disp = document.getElementById('displayInput').value.trim();
    var name = document.getElementById('bidderInput').value.trim();
    var urlInput = document.getElementById('avaUrlInput').value.trim();
    var val = Number(document.getElementById('amountInput').value || 0);

    var savedBin = false;
    var whoLabel = '';
    var spokenName = '';

    if (!tt && !name && !disp) {
      seats[idx] = makeSeat(idx, null);
    } else {
      var cached = name ? robloxCache[name.toLowerCase()] : null;
      var finalDisp = disp || (cached && cached.displayName) || '';
      var finalAva = urlInput || currentModalAvatar || (cached && cached.avatarUrl) || '';

      seats[idx].tiktok = tt;
      seats[idx].name = name;
      seats[idx].displayName = finalDisp;
      seats[idx].avatarUrl = finalAva;
      seats[idx].val = val;
      if (forceBinMode || val >= Number(cfg.bin)) {
        seats[idx].isBin = true;
        seats[idx].locked = true;
        savedBin = true;
      } else {
        seats[idx].isBin = false;
      }
      whoLabel = finalDisp || tt || name;
      spokenName = finalDisp || name || tt;
    }

    render();
    closeModal();

    if (whoLabel) {
      soundSeatSaved(savedBin, spokenName, idx + 1);
      if (savedBin) {
        showPopup('B.I.N LOCK', whoLabel + ' berada di kursi #' + (idx + 1) + ' (' + rFmt(val) + ')', 't-bin');
      } else {
        showPopup('KURSI TERSIMPAN', whoLabel + ' berada di kursi #' + (idx + 1) + ' (' + rFmt(val) + ')', '');
      }
    }
  }

  function quickBump(index) {
    var st = seats[index];
    if (st.locked || (!st.name && !st.tiktok && !st.displayName)) return;
    st.val = Number(st.val || 0) + Number(cfg.inc);
    var hitBin = false;
    if (st.val >= Number(cfg.bin)) {
      st.val = Number(cfg.bin);
      st.isBin = true;
      st.locked = true;
      hitBin = true;
    }
    render();
    var who = st.displayName || st.tiktok || st.name;
    var spoken = st.displayName || st.name || st.tiktok;
    soundSeatSaved(hitBin, spoken, st.id);
    showPopup(hitBin ? 'B.I.N LOCK' : 'UPDATE KURSI', who + ' berada di kursi #' + st.id + ' (' + rFmt(st.val) + ')', hitBin ? 't-bin' : '');
  }

  function toggleLock(index) {
    seats[index].locked = !seats[index].locked;
    if (!seats[index].locked) seats[index].isBin = false;
    render();
  }

  function togglePaid(index) {
    if (!seats[index].name && !seats[index].tiktok && !seats[index].displayName) return;
    seats[index].paid = !seats[index].paid;
    render();
  }

  function saveCfg() {
    cfg.count = Number(document.getElementById('inCount').value) || 19;
    cfg.ob = Number(document.getElementById('inOb').value) || 0;
    cfg.inc = Number(document.getElementById('inInc').value) || 1;
    cfg.bin = Number(document.getElementById('inBin').value) || 0;
    cfg.binNote = document.getElementById('inBinNote').value.trim();
    initSeats();
    setInfo('Tersimpan!');
  }

  function formatSec(sec) {
    var mins = String(Math.floor(sec / 60));
    if (mins.length < 2) mins = '0' + mins;
    var secs = String(sec % 60);
    if (secs.length < 2) secs = '0' + secs;
    return mins + ':' + secs;
  }

  function setTimerFromInput() {
    var sec = Number(document.getElementById('timerInput').value);
    if (!sec || sec <= 0) return;
    clearInterval(timerInterval);
    timeLeft = sec;
    isPaused = false;
    warned10Sec = (sec <= 10);
    document.getElementById('pauseBtn').innerText = '||';
    updateTimerDisplay();

    soundStartAuction();
    showPopup('MULAI LELANG', 'Lele dimulai • ' + formatSec(sec), 't-start');

    timerInterval = setInterval(function() {
      if (!isPaused) {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft === 10 && !warned10Sec) {
          warned10Sec = true;
          soundWarn10Sec();
          showPopup('SISA WAKTU', 'Waktu sisa 10 detik', 't-warn');
        }

        if (timeLeft <= 0) {
          timeLeft = 0;
          updateTimerDisplay();
          clearInterval(timerInterval);
          soundFinishAuction();
          showPopup('WAKTU SELESAI', 'Waktu selesai', 't-warn');
        }
      }
    }, 1000);
  }

  function togglePause() {
    if (timeLeft <= 0) return;
    isPaused = !isPaused;
    document.getElementById('pauseBtn').innerText = isPaused ? '>' : '||';
  }

  function stopTimer() {
    clearInterval(timerInterval);
    timeLeft = 0;
    isPaused = false;
    warned10Sec = false;
    document.getElementById('pauseBtn').innerText = '||';
    updateTimerDisplay();
  }

  function updateTimerDisplay() {
    var el = document.getElementById('timer');
    el.innerText = formatSec(timeLeft);
    el.className = (timeLeft <= 10 && timeLeft > 0) ? 'timer-txt warn' : 'timer-txt';
  }

  function copyAllTikTok() {
    var lines = [];
    var idx = 0;
    while (idx < seats.length) {
      var s = seats[idx];
      if (s.tiktok && s.tiktok.trim()) {
        lines.push('#' + s.id + ': ' + s.tiktok.trim());
      }
      idx++;
    }
    if (!lines.length) {
      setInfo('Belum ada Nama TikTok!');
      return;
    }
    copyTextSafe(lines.join('\n'), 'Semua TikTok tersalin!');
  }

  function copyAllDisplays() {
    var lines = [];
    var idx = 0;
    while (idx < seats.length) {
      var s = seats[idx];
      if (s.displayName && s.displayName.trim()) {
        lines.push('#' + s.id + ': ' + s.displayName.trim());
      }
      idx++;
    }
    if (!lines.length) {
      setInfo('Belum ada Display Name!');
      return;
    }
    copyTextSafe(lines.join('\n'), 'Semua Display tersalin!');
  }

  function copyList() {
    var lines = [];
    var idx = 0;
    while (idx < seats.length) {
      var s = seats[idx];
      if (!s.name && !s.tiktok && !s.displayName) {
        lines.push('#' + s.id + ': -');
      } else {
        var parts = [];
        if (s.tiktok) parts.push('TT: ' + s.tiktok);
        if (s.displayName) parts.push('Display: ' + s.displayName);
        if (s.name) parts.push('USN: ' + s.name);
        lines.push('#' + s.id + ': ' + parts.join(' | ') + ' [' + rFmt(s.val) + (s.isBin ? ' B.I.N' : '') + '] - ' + (s.paid ? 'OKE' : 'WAIT'));
      }
      idx++;
    }
    copyTextSafe(lines.join('\n'), 'List tersalin!');
  }

  function resetAll() {
    seats = [];
    initSeats();
    setInfo('Direset!');
  }

  document.getElementById('bidModal').onkeypress = function(e) {
    if (e.key === 'Enter') saveBid();
  };

  initSeats();
</script>
</body>
</html>

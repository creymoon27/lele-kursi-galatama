<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LELE Kursi Galatama</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #090e1a; color: #f8fafc; padding: 6px 8px; font-size: 11px; }
  .wrap { width: 100%; max-width: 1280px; margin: 0 auto; }

  .toast-wrap {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 250; pointer-events: none; display: flex; flex-direction: column; gap: 6px; align-items: center;
  }
  .toast-box {
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border: 2px solid #fbbf24; border-radius: 10px;
    padding: 8px 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.65);
    display: flex; align-items: center; gap: 10px;
    opacity: 0; transform: translateY(-10px) scale(0.96);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .toast-box.show { opacity: 1; transform: translateY(0) scale(1); }
  .toast-box.t-start { border-color: #10b981; }
  .toast-box.t-warn { border-color: #ef4444; background: linear-gradient(135deg, #450a0a, #190505); }
  .toast-box.t-bin { border-color: #a855f7; background: linear-gradient(135deg, #2e1065, #140929); }
  .toast-tag {
    font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 4px;
    background: #fbbf24; color: #000; letter-spacing: 0.4px;
  }
  .toast-box.t-start .toast-tag { background: #10b981; color: #000; }
  .toast-box.t-warn .toast-tag { background: #ef4444; color: #fff; }
  .toast-box.t-bin .toast-tag { background: #a855f7; color: #fff; }
  .toast-msg { font-size: 14px; font-weight: 900; color: #f8fafc; white-space: nowrap; }

  .top-bar {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
    background: linear-gradient(135deg, #1b2842, #111a2c);
    border: 1.5px solid #354b70; border-radius: 9px; padding: 10px 14px; margin-bottom: 6px;
  }
  .top-left { display: flex; flex-direction: column; gap: 6px; }
  .brand-title { font-size: 20px; font-weight: 900; color: #fbbf24; letter-spacing: 0.5px; line-height: 1.1; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pill { background: #0b1220; border: 1px solid #425982; padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 13px; }
  .pill-bin { border-color: #a855f7; color: #f3e8ff; background: #2a1842; }

  .right-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .mini-stat { background: #0b1220; border: 1px solid #3b4f73; border-radius: 7px; padding: 5px 11px; text-align: center; min-width: 72px; }
  .mini-stat small { color: #94a3b8; font-size: 10px; font-weight: 800; display: block; line-height: 1.1; }
  .mini-stat strong { font-size: 18px; font-weight: 900; color: #10b981; line-height: 1.2; }

  .timer-box {
    display: flex; align-items: center; gap: 7px;
    background: #090e1a; border: 2px solid #fbbf24; border-radius: 8px; padding: 6px 10px;
  }
  .timer-txt {
    font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums;
    min-width: 68px; text-align: center; color: #fff; line-height: 1;
  }
  .warn { color: #ef4444; }

  .cfg-bar {
    display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
    background: #151f32; border: 1px solid #2c3e5c; border-radius: 7px; padding: 5px 9px; margin-bottom: 6px;
  }
  .cfg-bar label { color: #94a3b8; font-size: 11px; font-weight: 600; }

  input, button { background: #0b1220; color: #f8fafc; border: 1px solid #475569; border-radius: 4px; padding: 3px 6px; font-size: 11px; }
  button { cursor: pointer; font-weight: 800; border: none; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  .b-gold { background: #fbbf24; color: #000; }
  .b-green { background: #10b981; color: #000; }
  .b-red { background: #ef4444; color: #fff; }
  .b-purple { background: #a855f7; color: #fff; }
  .b-gray { background: #334155; color: #fff; }
  .b-blue { background: #38bdf8; color: #000; }

  .list-panel { background: #151f32; border: 1px solid #2c3e5c; border-radius: 7px; overflow: hidden; }
  .list-head {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px;
    padding: 5px 9px; background: #1a263d; border-bottom: 1px solid #2c3e5c;
  }
  .list-head h2 { font-size: 12px; font-weight: 900; color: #fbbf24; }
  .sum-pills { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 10px; font-weight: 700; }
  .sum-pills span { background: #0b1220; padding: 2px 6px; border-radius: 4px; border: 1px solid #334155; }

  .two-col-grid { display: grid; grid-template-columns: 1fr 1fr; }
  .col-box:first-child { border-right: 1px solid #2c3e5c; }

  @media (max-width: 980px) {
    .two-col-grid { grid-template-columns: 1fr; }
    .col-box:first-child { border-right: none; }
  }

  .seat-row {
    display: grid;
    grid-template-columns: 22px minmax(74px, 96px) minmax(74px, 96px) minmax(80px, 1fr) 40px 28px 42px auto;
    align-items: center;
    gap: 3px;
    padding: 3px 5px;
    background: #121b2d;
    border-bottom: 1px solid #1e2d44;
  }
  .seat-row:nth-child(even) { background: #172238; }
  .seat-row.has-bid { border-left: 3px solid #fbbf24; }
  .seat-row.locked { border-left: 3px solid #10b981; }
  .seat-row.bin-row { border-left: 3px solid #a855f7; background: #211633; }

  .r-no { font-weight: 900; font-size: 11px; color: #fbbf24; }

  .copy-box {
    display: flex; align-items: center; justify-content: space-between; gap: 2px;
    background: #0b1220; border: 1px solid #334155; border-radius: 4px;
    padding: 1px 3px; min-width: 0;
  }
  .tt-txt {
    font-size: 10px; font-weight: 700; color: #fbbf24;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    user-select: all; cursor: text; flex: 1;
  }
  .disp-txt {
    font-size: 10px; font-weight: 700; color: #7dd3fc;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    user-select: all; cursor: text; flex: 1;
  }
  .box-empty { color: #475569; font-style: italic; font-weight: 400; user-select: none; }
  .copy-mini {
    background: #1e293b; color: #e2e8f0; border: 1px solid #475569;
    border-radius: 3px; padding: 1px 3px; font-size: 8px; font-weight: 800; flex-shrink: 0;
  }
  .copy-mini:hover { background: #38bdf8; color: #000; border-color: #38bdf8; }

  .player-cell { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .ava-box {
    width: 21px; height: 21px; border-radius: 50%;
    border: 1.5px solid #475569; background: #0b1220;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 9px; font-weight: 900; color: #fbbf24;
  }
  .seat-row.has-bid .ava-box { border-color: #fbbf24; }
  .seat-row.locked .ava-box { border-color: #10b981; }
  .seat-row.bin-row .ava-box { border-color: #a855f7; }
  .ava-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .r-name { font-weight: 800; font-size: 10px; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }
  .r-empty { color: #64748b; font-style: italic; font-weight: 400; font-size: 10px; }

  .r-badge { display: inline-block; text-align: center; font-size: 9px; font-weight: 900; padding: 1px 3px; border-radius: 3px; background: #334155; color: #cbd5e1; }
  .badge-bid { background: #453208; color: #fbbf24; }
  .badge-lock { background: #093b2a; color: #34d399; }
  .badge-bin { background: #3b195c; color: #f3e8ff; }

  .r-val { font-weight: 900; font-size: 11px; color: #10b981; text-align: right; }

  .pay-btn { padding: 1px 3px; border-radius: 3px; font-size: 9px; width: 100%; }
  .paid { background: #093b2a; color: #34d399; border: 1px solid #10b981; }
  .unpaid { background: #451212; color: #f87171; border: 1px solid #ef4444; }

  .r-actions { display: flex; gap: 2px; justify-content: flex-end; }
  .r-actions button { padding: 2px 3px; font-size: 9px; line-height: 1.1; }

  .modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.78);
    justify-content: center; align-items: center; z-index:
